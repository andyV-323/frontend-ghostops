version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: Cache-Control
          value: no-store
        - key: X-Frame-Options
          value: DENY
        - key: X-Content-Type-Options
          value: nosniff
        - key: Referrer-Policy
          value: strict-origin-when-cross-origin
        - key: Strict-Transport-Security
          value: 'max-age=31536000; includeSubDomains'
        - key: Content-Security-Policy
          value: >-
            default-src 'self';
            script-src 'self';
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src 'self' https://fonts.gstatic.com data:;
            img-src 'self' data: blob: https:;
            connect-src 'self' https://api.ghostopsai.com
            https://us-east-1gmrbu64hs.auth.us-east-1.amazoncognito.com
            https://cognito-idp.us-east-1.amazonaws.com;
            object-src 'none';
            base-uri 'self';
            frame-ancestors 'none';
  redirects:
    - source: </^[^.]+$/>
      target: /index.html
      status: '200'
